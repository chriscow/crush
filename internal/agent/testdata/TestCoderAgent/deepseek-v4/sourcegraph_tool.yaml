    body: '{"data":{"search":{"results":{"matchCount":30,"limitHit":true,"resultCount":30,"approximateResultCount":"30+","missing":[],"timedout":[],"indexUnavailable":false,"results":[{"__typename":"FileMatch","repository":{"name":"github.com/NesoHQ/bgce-archive"},"file":{"path":"docs/interview-qna/class-wise/golang020-init-function/main.go","url":"/r/github.com/NesoHQ/bgce-archive/-/blob/docs/interview-qna/class-wise/golang020-init-function/main.go","content":"\n/*\n//first example\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Hello Init Function!\")\n}\n\nfunc init() {\n\tfmt.Println(\"I am the function that is executed first\")\n}\n*/\n\n//Second example\npackage main\n\nimport \"fmt\"\n\nvar a = 10\n\nfunc main() {\n\tfmt.Println(a)\n}\n\nfunc init() {\n\tfmt.Println(a)\n\ta = 20\n}\n\n"},"lineMatches":[{"preview":"func main() {","lineNumber":23,"offsetAndLengths":[[0,9]]},{"preview":"func main() {","lineNumber":7,"offsetAndLengths":[[0,9]]},{"preview":"\tfmt.Println(\"Hello Init Function!\")","lineNumber":8,"offsetAndLengths":[[25,4]]},{"preview":"package main","lineNumber":17,"offsetAndLengths":[[8,4]]},{"preview":"package main","lineNumber":3,"offsetAndLengths":[[8,4]]},{"preview":"func init() {","lineNumber":11,"offsetAndLengths":[[0,4]]},{"preview":"\tfmt.Println(\"I am the function that is executed first\")","lineNumber":12,"offsetAndLengths":[[23,4]]},{"preview":"func init() {","lineNumber":27,"offsetAndLengths":[[0,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/juanfont/headscale"},"file":{"path":"tools/bump/main.go","url":"/r/github.com/juanfont/headscale/-/blob/tools/bump/main.go","content":"// Command bump keeps headscale''s pinned versions current and puts the result\n// in front of a maintainer as a single reviewable pull request.\n//\n// The pins are interlocked. flake.nix asks nixpkgs for the newest Go, so a lock\n// update moves the compiler and every devShell tool at once. Two Dockerfiles\n// compile a tailscale tree cloned from an unpinned branch, so their builder\n// image has to keep up with upstream''s go directive. go.mod carries two pairs\n// that must move together. The capability-version table is scraped from\n// tailscale''s published tags, so it goes stale without anyone touching the\n// repository.\n//\n// Each of those is an area: applied, gated, and committed on its own, so one\n// failure costs one commit rather than the whole pull request.\n//\n//\tbump plan     resolve every source of truth and print what would change\n//\tbump run      apply, gate, and open or update the pull request\n//\tbump verify   assert the pins are mutually consistent\npackage main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\t\"strings\"\n\n\t\"github.com/creachadair/command\"\n\t\"github.com/creachadair/flax\"\n)\n\ntype runFlags struct {\n\tDryRun bool   `flag:\"dry-run,default=false,Rebuild the branch locally and report, but run no final gate and touch no remote\"`\n\tNoPR   bool   `flag:\"no-pr,default=false,Push nothing and open no pull request\"`\n\tAreas  string `flag:\"areas,Comma-separated areas to run (default: all)\"`\n\tSkip   string `flag:\"skip,Comma-separated areas to skip\"`\n\tForce  bool   `flag:\"force,default=false,Open a pull request even if an identical one was closed unmerged\"`\n\tBranch string `flag:\"branch,default=automation/version-bump,Branch to push\"`\n\tBase   string `flag:\"base,default=main,Base branch\"`\n\tRemote string `flag:\"remote,default=origin,Git remote\"`\n\tRepo   string `flag:\"repo,GitHub repository (default: the one the job runs in)\"`\n\tGate   string `flag:\"gate,default=full,Final gate level: none, quick or full\"`\n}\n\nvar runCfg runFlags\n\nfunc main() {\n\tlog.SetFlags(0)\n\tlog.SetPrefix(\"bump: \")\n\n\troot := command.C{\n\t\tName: \"bump\",\n\t\tHelp: \"Keep headscale''s pinned versions current\",\n\t\tCommands: []*command.C{\n\t\t\t{\n\t\t\t\tName: \"plan\",\n\t\t\t\tHelp: \"Resolve every source of truth and print what would change\",\n\t\t\t\tRun:  func(env *command.Env) error { return cmdPlan(env.Context()) },\n\t\t\t},\n\t\t\t{\n\t\t\t\tName:     \"run\",\n\t\t\t\tHelp:     \"Apply, gate, and open or update the pull request\",\n\t\t\t\tSetFlags: command.Flags(flax.MustBind, \u0026runCfg),\n\t\t\t\tRun:      func(env *command.Env) error { return cmdRun(env.Context()) },\n\t\t\t},\n\t\t\t{\n\t\t\t\tName: \"verify\",\n\t\t\t\tHelp: \"Assert the pins are mutually consistent\",\n\t\t\t\tRun:  func(env *command.Env) error { return cmdVerify(env.Context()) },\n\t\t\t},\n\t\t\tcommand.HelpCommand(nil),\n\t\t},\n\t}\n\n\tcommand.RunOrFail(root.NewEnv(nil), os.Args[1:])\n}\n\n// selector turns the --areas and --skip flags into a predicate.\nfunc selector(only, skip string) func(string) bool {\n\tset := func(s string) map[string]bool {\n\t\tm := map[string]bool{}\n\n\t\tfor part := range strings.SplitSeq(s, \",\") {\n\t\t\tif part = strings.TrimSpace(part); part != \"\" {\n\t\t\t\tm[part] = true\n\t\t\t}\n\t\t}\n\n\t\treturn m\n\t}\n\n\twanted, skipped := set(only), set(skip)\n\n\treturn func(name string) bool {\n\t\tif skipped[name] {\n\t\t\treturn false\n\t\t}\n\n\t\treturn len(wanted) == 0 || wanted[name]\n\t}\n}\n\nfunc cmdRun(ctx context.Context) error {\n\tgate := runCfg.Gate\n\tnoPR := runCfg.NoPR\n\n\tif runCfg.DryRun {\n\t\tgate, noPR = gateNone, true\n\t}\n\n\tr, err := openRepo(ctx)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tif err := startBranch(ctx, r, runCfg.Remote, runCfg.Base, runCfg.Branch); err != nil { //nolint:noinlineerr\n\t\treturn err\n\t}\n\n\tresults, err := runAreas(ctx, r, allAreas(), selector(runCfg.Areas, runCfg.Skip))\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tresults, err = enforceFinalGate(ctx, r, results, gate)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\ttree, err := treeSHA(ctx, r)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\thead, err := headSHA(ctx, r)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tbody := renderBody(results, markerOf(results, tree, head), gate)\n\n\tif err := writeStepSummary(body); err != nil { //nolint:noinlineerr\n\t\treturn err\n\t}\n\n\tif !anyApplied(results) {\n\t\tlog.Print(\"nothing moved\")\n\n\t\treturn nil\n\t}\n\n\tif noPR {\n\t\tfmt.Print(body)\n\n\t\treturn nil\n\t}\n\n\tslug, err := currentSlug(ctx, r, runCfg.Repo)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\treturn publish(ctx, r, publishOptions{\n\t\tSlug:   slug,\n\t\tRemote: runCfg.Remote,\n\t\tBranch: runCfg.Branch,\n\t\tBase:   runCfg.Base,\n\t\tTitle:  \"all: bump pinned versions\",\n\t\tGate:   gate,\n\t\tForce:  runCfg.Force,\n\t}, results)\n}\n\nfunc anyApplied(results []result) bool {\n\tfor _, res := range results {\n\t\tif res.Commit != \"\" {\n\t\t\treturn true\n\t\t}\n\t}\n\n\treturn false\n}\n\n// writeStepSummary mirrors the report into the workflow run page, so a run that\n// opens no pull request still says why.\nfunc writeStepSummary(body string) error {\n\tpath := os.Getenv(\"GITHUB_STEP_SUMMARY\")\n\tif path == \"\" {\n\t\treturn nil\n\t}\n\n\t//nolint:gosec // the path is the workflow runner''s own summary file\n\tf, err := os.OpenFile(path, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o600)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"opening step summary: %w\", err)\n\t}\n\tdefer f.Close()\n\n\tif _, err := f.WriteString(body); err != nil { //nolint:noinlineerr\n\t\treturn fmt.Errorf(\"writing step summary: %w\", err)\n\t}\n\n\treturn nil\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":45,"offsetAndLengths":[[0,9]]},{"preview":"package main","lineNumber":17,"offsetAndLengths":[[8,4]]},{"preview":"func selector(only, skip string) func(string) bool {","lineNumber":77,"offsetAndLengths":[[0,4],[33,4]]},{"preview":"\tset := func(s string) map[string]bool {","lineNumber":78,"offsetAndLengths":[[8,4]]},{"preview":"\treturn func(name string) bool {","lineNumber":92,"offsetAndLengths":[[8,4]]},{"preview":"func cmdRun(ctx context.Context) error {","lineNumber":101,"offsetAndLengths":[[0,4]]},{"preview":"func anyApplied(results []result) bool {","lineNumber":172,"offsetAndLengths":[[0,4]]},{"preview":"func writeStepSummary(body string) error {","lineNumber":184,"offsetAndLengths":[[0,4]]},{"preview":"\tBase   string `flag:\"base,default=main,Base branch\"`","lineNumber":37,"offsetAndLengths":[[35,4]]},{"preview":"// in front of a maintainer as a single reviewable pull request.","lineNumber":1,"offsetAndLengths":[[17,4]]},{"preview":"\t\t\t\tRun:  func(env *command.Env) error { return cmdPlan(env.Context()) },","lineNumber":56,"offsetAndLengths":[[10,4]]},{"preview":"\t\t\t\tRun:  func(env *command.Env) error { return cmdVerify(env.Context()) },","lineNumber":67,"offsetAndLengths":[[10,4]]},{"preview":"\t\t\t\tRun:      func(env *command.Env) error { return cmdRun(env.Context()) },","lineNumber":62,"offsetAndLengths":[[14,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/Balun-courses/deep_go"},"file":{"path":"lessons/functions/defer_with_function/main.go","url":"/r/github.com/Balun-courses/deep_go/-/blob/lessons/functions/defer_with_function/main.go","content":"package main\n\nimport \"fmt\"\n\nfunc get() string {\n\tfmt.Println(\"1\")\n\treturn \"\"\n}\n\nfunc handle(string) {\n\tfmt.Println(\"3\")\n}\n\nfunc process() {\n\tdefer handle(get())\n\tfmt.Println(\"2\")\n}\n\nfunc main() {\n\tprocess()\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":18,"offsetAndLengths":[[0,9]]},{"preview":"package main","lineNumber":0,"offsetAndLengths":[[8,4]]},{"preview":"func process() {","lineNumber":13,"offsetAndLengths":[[0,4]]},{"preview":"func get() string {","lineNumber":4,"offsetAndLengths":[[0,4]]},{"preview":"func handle(string) {","lineNumber":9,"offsetAndLengths":[[0,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/NesoHQ/bgce-archive"},"file":{"path":"docs/interview-qna/class-wise/golang021-anonymous-func-and-iife/main.go","url":"/r/github.com/NesoHQ/bgce-archive/-/blob/docs/interview-qna/class-wise/golang021-anonymous-func-and-iife/main.go","content":"//Anonymous function\n//IIFE - immediately invoke function expression\n\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\t//anonymous function\n\tfunc(a int, b int) {\n\t\tc := a + b\n\t\tfmt.Println(c)\n\t}(5,7) //IIFE\n}\n\n\nfunc init() {\n\tfmt.Println(\"I''ll be called first\")\n}\n\n"},"lineMatches":[{"preview":"func main() {","lineNumber":7,"offsetAndLengths":[[0,9]]},{"preview":"\t//anonymous function","lineNumber":8,"offsetAndLengths":[[13,4]]},{"preview":"\tfunc(a int, b int) {","lineNumber":9,"offsetAndLengths":[[1,4]]}]}]}}}}'
